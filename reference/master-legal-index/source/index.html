<script>
function h(tag,attrs){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false)continue; if(k==='class')e.className=v; else e.setAttribute(k,v); }
  for(const c of Array.prototype.slice.call(arguments,2).flat(3)){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const tagEl=(t,cls)=>h('span',{class:'tag '+(cls||t)},t);
const pill=(t,cls)=>h('span',{class:'pill '+(cls||'')},t);

function renderItem(sec,it){
  if(sec.type==='entries'){
    const tags=[]; if(it.j)tags.push(tagEl(it.j==='MO'?'MO':it.j==='FED'?'FED':'MO+FED',it.j));
    (it.tags||[]).forEach(t=>tags.push(tagEl(t,'')));
    if(it.chk)tags.push(tagEl('check subsection','chk'));
    const li=h('div',{class:'entry','data-j':it.j||''},
      h('div',{class:'k'},it.k),
      h('div',{},h('div',{class:'t'},it.t),it.d&&h('div',{class:'d'},it.d),tags.length&&h('div',{class:'tags'},tags)));
    return li;
  }
  if(sec.type==='cards'){
    const dl=h('dl',{});
    (it.fields||[]).forEach(f=>{dl.append(h('dt',{},f[0]),h('dd',{},f[1]))});
    return h('article',{class:'card'},
      h('div',{class:'no'},it.no),
      h('h3',{},it.title),
      h('div',{class:'meta'},(it.pills||[]).map(p=>pill(p[0],p[1]))),
      it.sum&&h('p',{},it.sum),dl);
  }
  if(sec.type==='list'){
    return h('li',{},it.pill&&pill(it.pill[0],it.pill[1]),it.tag&&h('span',{class:'mono'},it.tag),h('span',{class:'b'},it.text));
  }
  if(sec.type==='table'){
    const tr=h('tr',{});
    sec.cols.forEach(c=>{const v=c.f?c.f(it):it[c.key];tr.append(h('td',{class:(c.mono?'mono ':'')+(c.nw?'nw':'')},v))});
    return tr;
  }
}

function renderBook(cfg){
  const app=document.getElementById('app'); const wrap=h('div',{class:'wrap'}); app.append(wrap);
  wrap.append(h('header',{class:'top'},h('div',{class:'kicker'},cfg.kicker),h('h1',{},cfg.title),h('p',{class:'sub'},cfg.subtitle),h('div',{class:'banner'},cfg.banner)));
  const search=h('input',{type:'search',id:'q',placeholder:cfg.placeholder||'Search this book','aria-label':'Search this book'});
  const status=h('span',{class:'status',id:'st'});
  const themeBtn=h('button',{class:'themebtn',type:'button',id:'theme'},'Theme: system');
  const chips=h('div',{class:'chips'});
  let jf='';
  (cfg.chips||[]).forEach((c,i)=>{const b=h('button',{class:'chip',type:'button','aria-pressed':i===0?'true':'false'},c[0]);b.onclick=()=>{jf=c[1];[...chips.children].forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));apply()};chips.append(b)});
  wrap.append(h('div',{class:'bar'},search,chips,status,themeBtn));
  const toc=h('ol',{}); const main=h('main',{});
  wrap.append(h('div',{class:'layout'},h('nav',{class:'toc','aria-label':'Contents'},h('details',{open:'open'},h('summary',{},'Contents'),toc)),main));
  const secEls=[];
  cfg.sections.forEach(sec=>{
    const cnt=h('span',{class:'cnt'});
    const s=h('section',{id:sec.id},h('h2',{},sec.title,cnt));
    if(sec.intro)s.append(h('p',{class:'intro'},sec.intro));
    let items=[];
    if(sec.type==='prose'){ const d=h('div',{class:'prose'}); sec.paras.forEach(p=>d.append(h('p',{},p))); s.append(d); }
    else if(sec.type==='table'){
      const tb=h('tbody',{}); const rows=sec.items.map(it=>{const r=renderItem(sec,it);r.dataset.text=JSON.stringify(it,(k,v)=>typeof v==='function'?undefined:v).toLowerCase()+' '+sec.cols.map(c=>c.f?String((c.f(it).textContent!==undefined?c.f(it).textContent:c.f(it))):'').join(' ').toLowerCase();tb.append(r);return r});
      s.append(h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},sec.cols.map(c=>h('th',{},c.h)))),tb))); items=rows;
    } else {
      const box=h(sec.type==='cards'?'div':sec.type==='list'?'ul':'div',{class:sec.type==='cards'?'cards':sec.type==='list'?'plain':'rows'});
      items=sec.items.map(it=>{const r=renderItem(sec,it);r.dataset.text=JSON.stringify(it).toLowerCase();box.append(r);return r});
      s.append(box);
    }
    s._items=items; s._cnt=cnt; s._n=items.length; secEls.push(s); main.append(s);
    toc.append(h('li',{},h('a',{href:'#'+sec.id},h('span',{},sec.title),h('span',{class:'n'},items.length||''))));
  });
  const none=h('div',{class:'empty',hidden:'hidden'},'No entries match. Clear the search or filter.'); main.append(none);
  wrap.append(h('footer',{},cfg.footer));
  function apply(){
    const q=search.value.trim().toLowerCase(); let total=0,shown=0;
    secEls.forEach(s=>{
      let vis=0; s._items.forEach(r=>{
        const okq=!q||r.dataset.text.includes(q); const okj=!jf||!r.dataset.j||r.dataset.j===jf||r.dataset.j==='BOTH'&&true;
        const ok=okq&&okj; r.hidden=!ok; if(ok)vis++; });
      total+=s._n; shown+=vis;
      s._cnt.textContent=s._n?(vis===s._n?s._n+' entries':vis+' of '+s._n):'';
      s.hidden=s._n>0&&vis===0&&(q||jf);
    });
    status.textContent=(q||jf)?shown+' of '+total+' shown':total+' entries';
    none.hidden=!((q||jf)&&shown===0);
  }
  search.addEventListener('input',apply); apply();
  const modes=['system','light','dark'];
  function setTheme(m){ const r=document.documentElement; if(m==='system')r.removeAttribute('data-theme'); else r.setAttribute('data-theme',m); themeBtn.textContent='Theme: '+m; try{localStorage.setItem('bk-theme',m)}catch(e){} themeBtn.dataset.m=m; }
  let cur='system'; try{cur=localStorage.getItem('bk-theme')||'system'}catch(e){}
  setTheme(modes.includes(cur)?cur:'system');
  themeBtn.onclick=()=>setTheme(modes[(modes.indexOf(themeBtn.dataset.m)+1)%3]);
}

{id:'claims',type:'entries',title:'Claim and Defense Element Finder',intro:'Elements as generally stated in Missouri and federal law. Use these as a checklist, then pull the controlling case and the Missouri Approved Instructions (MAI) for the exact form.',
 items:[
 E('MO','Conversion','Elements','(1) plaintiff owned or had the right to possess the property; (2) defendant took possession with intent to exercise control inconsistent with the owner’s rights; (3) owner deprived of the right to possess. Demand and refusal may be needed when possession was initially lawful.',true),
 E('MO','Negligence','Elements','Duty, breach, causation, damages.'),
 E('MO','Bailment','Elements','Delivery of personal property for a purpose, acceptance, understanding that it be returned or disposed of as directed. Failure to return or wrongful release can support conversion or breach.',true),
 E('MO','Fraud (Missouri)','Nine elements','Representation; falsity; materiality; speaker’s knowledge of falsity; intent that it be acted on; hearer’s ignorance of falsity; reliance; right to rely; proximate injury. Plead with particularity (Rule 55.15).',true),
 E('MO','Civil conspiracy','Elements','Two or more persons; an unlawful objective or lawful objective by unlawful means; meeting of the minds; an overt act (tort) in furtherance; damages. Conspiracy is not a standalone tort without an underlying wrong.',true),
 E('MO','Unjust enrichment','Elements','Benefit conferred by plaintiff; defendant appreciated it; defendant accepted and retained it under circumstances that make retention unjust.',true),
 E('MO','MMPA','Elements','Purchase or lease of merchandise primarily for personal, family or household purposes; unlawful practice under § 407.020; ascertainable loss of money or property as a result. No purchase from the defendant is a common problem.',true),
 E('MO','Defamation / false report','Elements','Publication; of a defamatory statement; that identifies the plaintiff; false; made with the required fault; damage to reputation. Statements to police may carry a qualified privilege defeated by malice or falsity known to the speaker.',true),
 E('MO','False imprisonment','Elements','Detention or restraint against the person’s will; without legal justification. Two-year limitation under § 516.140.',true),
 E('MO','Malicious prosecution','Elements','Earlier proceeding commenced against plaintiff; instigated by defendant; terminated in plaintiff’s favor; no probable cause; malice; damages.',true),
 E('MO','Intrusion upon seclusion','Elements','Intentional intrusion into a private matter or place where the plaintiff has a reasonable expectation of privacy, highly offensive to a reasonable person.',true),
 E('FED','§ 1983 false arrest / unlawful seizure','Elements','Person acting under color of state law; seizure without probable cause (or without reasonable suspicion for a stop). Qualified immunity is the main defense.'),
 E('FED','§ 1983 municipal liability (Monell)','Elements','Constitutional violation caused by an official policy, widespread custom, or decision of a final policymaker. No respondeat superior.'),
 E('FED','ADA Title I discrimination','Elements','Disability; qualified for the job with or without accommodation; adverse action because of the disability. Timely EEOC charge is a prerequisite.',true),
 E('FED','FMLA interference','Elements','Eligible employee; covered employer; entitled to leave; gave notice; employer denied or interfered with benefits.',true),
 E('FED','FMLA retaliation','Elements','Protected activity; adverse action; causal connection.',true),
 E('MO','MHRA discrimination','Elements','Protected class or disability; adverse action; the protected trait was a contributing factor (Missouri standard is more plaintiff-friendly than the federal one). Charge to MCHR within 180 days.',true),
 E('MO','Order of protection: sufficiency of evidence','Standard','Petitioner proves abuse or stalking by a preponderance of the evidence; appellate review under Murphy v. Carron.',true)]},

 {e:'Amend pleading as of right',m:'Before responsive pleading served (Rule 55.33)',f:'21 days after service or after responsive pleading / Rule 12 motion (Rule 15)'},
 {e:'Summary judgment',m:'Rule 74.04',f:'Rule 56 and local rule'},
 {e:'New trial / amend judgment',m:'30 days after entry (Rule 78.04)',f:'28 days after entry (Rule 59)'},

 {e:'Record on appeal',m:'90 days after notice of appeal (Rule 81.19)',f:'14 days to order transcript (FRAP 10(b))'},

{id:'glossary',type:'entries',title:'Glossary',
 items:[
 E('','Affirmative defense','','A defense that admits the claim but avoids liability (limitations, release, privilege). Must be pleaded.'),
 E('','Bailment','','Delivery of personal property to another for a limited purpose with the duty to return or dispose of it as directed.'),
 E('','Change of judge','','Missouri procedure to replace the assigned judge, by right (Rule 51.05) or for cause.'),
 E('','Consent judgment','','Judgment entered on the parties’ agreement; appealability differs from a contested judgment.'),
 E('','Conversion','','Unauthorized assumption of ownership over another’s personal property.'),
 E('','Default (interlocutory order of default)','','Court entry that a party failed to plead or defend; judgment follows after proof.'),
 E('','Deemed admitted','','Matters in a request for admission treated as true after a missed deadline.'),
 E('','En banc / banc','','The full Missouri Supreme Court.'),
 E('','Heck bar','','Bar on § 1983 damages that would undermine a standing conviction.'),
 E('','In forma pauperis (IFP)','','Permission to proceed without paying court fees.'),
 E('','Interlocutory','','Not final; an interim order.'),
 E('','Monell claim','','Section 1983 claim against a local government based on its own policy or custom.'),
 E('','Motion in limine','','Pretrial request to exclude or limit evidence.'),
 E('','Nolle prosequi / dismissal without prejudice','','Prosecutor drops charges; refiling may be allowed within limits.'),
 E('','Qualified immunity','','Officials are immune from damages unless they violated clearly established law.'),
 E('','Qualified privilege','','Defense to defamation for good-faith statements to those with a duty or interest; lost by malice.'),
 E('','Return of service','','Sworn proof of who served whom, how, and when.'),
 E('','Respondeat superior','','Employer liability for an employee’s acts; not available under § 1983.'),
 E('','Statute of limitations','','Deadline to file. Tolling can pause it.'),
 E('','Tolling','','Legal pause of a limitation period.'),
 E('','Writ of prohibition / mandamus','','Extraordinary writs to control a lower court or compel a duty.'),
 E('','Sunshine request','','Missouri public records request under chapter 610.'),
 E('','Case.net','','Missouri Courts online docket system; some case types are login-gated.')]},

{id:'prose',type:'prose',title:'How to Use This Book',
 paras:['Start in the Element Finder when you know the claim. Start in the rule blocks when you have a deadline. Start in Case Law when you need authority for a motion or a brief.','Filter by Missouri or Federal at the top. Many matters cross both systems, so the default is both.','Each entry flagged "check subsection" needs the exact subdivision confirmed. Rule numbers change; the official text controls.','Volume II, the Garner Case Index, maps every pending matter to the entries here.']}
]};
