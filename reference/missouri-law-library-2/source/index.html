<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missouri Law Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed header with search; two-pane library (contents tree | reading pane), collapsing to one pane on phones */
:root{
  --bg:#f5f7f9; --panel:#ffffff; --ink:#18242f; --muted:#5b6874; --rule:#d9e0e6;
  --accent:#1d6650; --accent-soft:#e3f0eb; --mark:#fff0b8; --hist:#f1f4f6; --warn:#8a4b0f;
  --f-display:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#151f27; --ink:#e3e9ee; --muted:#9aa8b4; --rule:#26343f;
  --accent:#5fc3a2; --accent-soft:#183a30; --mark:#5a4a12; --hist:#1b2731; --warn:#e3a35f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#151f27; --ink:#e3e9ee; --muted:#9aa8b4; --rule:#26343f;
  --accent:#5fc3a2; --accent-soft:#183a30; --mark:#5a4a12; --hist:#1b2731; --warn:#e3a35f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule);padding-block:10px;padding-inline:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-display);font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:.75rem}
.search{flex:1 1 360px;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.search input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.search select,.btn{font:inherit;font-size:.85rem;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.menu-btn{display:none}
.main{display:grid;grid-template-columns:minmax(240px,320px) 1fr;min-height:0}
nav{border-right:1px solid var(--rule);overflow:auto;padding-block:12px;padding-inline:12px;background:var(--panel)}
nav details{margin-bottom:2px}
nav summary{cursor:pointer;font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:5px 4px;list-style-position:outside}
nav summary .rng{font-family:var(--f-mono);font-weight:400;text-transform:none;letter-spacing:0;margin-right:4px}
nav ul{list-style:none;margin:0 0 6px;padding:0 0 0 6px}
nav li button{all:unset;cursor:pointer;display:grid;grid-template-columns:3.4em 1fr;gap:6px;width:100%;padding:3px 6px;border-radius:4px;font-size:.86rem;line-height:1.3}
nav li button:hover{background:var(--accent-soft)}
nav li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav li .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right}
.read{overflow:auto;min-width:0;padding-block:20px 60px;padding-inline:16px}
.inner{max-width:68ch;margin:0 auto}
.crumb{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chap-h{font-family:var(--f-display);font-size:1.7rem;line-height:1.2;margin:.2em 0 .3em;text-wrap:balance}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--muted);font-size:.85rem;margin-bottom:14px}
.toc-mini{columns:2 16em;column-gap:20px;font-size:.84rem;margin:0 0 22px;padding:12px 14px;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
.toc-mini a{display:block;text-decoration:none;color:var(--ink);padding:1px 0;break-inside:avoid}
.toc-mini a b{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-right:6px}
article.sec{border-top:1px solid var(--rule);padding-block:18px;scroll-margin-top:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sec-num{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:1rem}
.sec-title{font-family:var(--f-display);font-size:1.12rem;font-weight:700;margin:0;text-wrap:balance}
.sec-body{font-family:var(--f-body);font-size:1.02rem;line-height:1.62}
.sec-body p{margin:.55em 0}
.sec-body p.sub{padding-left:1.4em}
.sec-body p.sub2{padding-left:2.8em}
.hist{background:var(--hist);border-radius:6px;padding:8px 12px;font-size:.83rem;color:var(--muted);margin-top:10px}
.hist p{margin:.25em 0}
.hist .ann{color:var(--ink);font-family:var(--f-body);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools .btn{font-size:.75rem;padding:4px 8px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.results .hit{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);margin-bottom:8px}
.results .hit:hover{border-color:var(--accent)}
.results .hit .t{font-weight:600}
.results .hit .s{font-family:var(--f-body);font-size:.92rem;color:var(--muted);margin-top:3px}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:10px 0}
.progress span{display:block;height:100%;background:var(--accent);width:0}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}
.note{font-size:.85rem;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.quick button{font:inherit;font-size:.8rem;font-family:var(--f-mono);padding:4px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:.85rem}
@media (max-width:820px){
  .app{display:block;height:auto}
  header{position:static}
  .read{overflow:visible}
  .main{grid-template-columns:1fr}
  nav{display:none;border-right:0;border-bottom:1px solid var(--rule);max-height:60vh}
  nav.open{display:block}
  .menu-btn{display:inline-block}
}
@media (prefers-reduced-motion:no-preference){.progress span{transition:width .2s}}
</style>

<div class="app">
  <header>
    <button class="btn menu-btn" id="menuBtn" aria-controls="nav" aria-expanded="false">Contents</button>
    <div class="brand"><h1>Missouri Law Library</h1><small id="asof">Constitution &amp; RSMo · text from revisor.mo.gov</small></div>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Section number (575.150, I 18(c)) or words (resisting arrest)" aria-label="Search the Missouri Constitution and statutes" autocomplete="off">
      <select id="mode" aria-label="Search scope">
        <option value="auto">Number or heading</option>
        <option value="full">Full text (all chapters)</option>
      </select>
      <button class="btn primary" type="submit" id="go">Search</button>
    </form>
  </header>
  <div class="main">
    <nav id="nav" aria-label="Contents"><p class="note">Loading contents…</p></nav>
    <main class="read" id="read"><div class="inner" id="view"><p class="note">Loading…</p></div></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const view=$('#view'), nav=$('#nav'), read=$('#read');
let TOC=null; const cache=new Map(); let current=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800)}
function copy(text){
  const done=()=>toast('Copied');
  try{navigator.clipboard.writeText(text).then(done,()=>fallback(text))}catch(e){fallback(text)}
  function fallback(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Select and copy the text manually')}ta.remove()}
}
// token for hashes: "575.150" -> "s575.150"; "I Section 18(c)" -> "cI-18c"
function tok(kind,num){ if(kind==='const'){const m=num.match(/^([IVX]+) Section (.+)$/); return 'c'+m[1]+'-'+m[2].replace(/[()]/g,'');} return 's'+num; }
function cite(kind,num){ if(kind==='const'){const m=num.match(/^([IVX]+) Section (.+)$/); return 'Mo. Const. art. '+m[1]+', § '+m[2];} return '§ '+num+', RSMo'; }
function srcUrl(kind,num,ch){ if(kind==='const'){return 'https://revisor.mo.gov/main/ViewChapter.aspx?chapter='+ch+'&constit=y';} return 'https://revisor.mo.gov/main/OneSection.aspx?section='+num; }

async function getChap(key){
  if(cache.has(key)) return cache.get(key);
  const p=fetch('data/c/'+key+'.json').then(r=>{if(!r.ok) throw new Error('HTTP '+r.status);return r.json()});
  cache.set(key,p); try{return await p}catch(e){cache.delete(key);throw e}
}
function chapInfo(key){ for(const g of TOC.groups) for(const c of g.chapters) if(c.key===key) return {g,c}; return null; }

function buildNav(){
  let h='';
  for(const g of TOC.groups){
    h+=`<details${g.open?' open':''}><summary><span class="rng">${esc(g.range)}</span>${esc(g.name)}</summary><ul>`;
    for(const c of g.chapters) h+=`<li><button data-key="${esc(c.key)}" aria-current="false"><span class="num">${esc(c.label)}</span><span>${esc(c.name)}</span></button></li>`;
    h+='</ul></details>';
  }
  nav.innerHTML=h;
  nav.addEventListener('click',e=>{const b=e.target.closest('button[data-key]'); if(b){openChapter(b.dataset.key); if(innerWidth<=820){nav.classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}}});
}
function markNav(key){ nav.querySelectorAll('button[data-key]').forEach(b=>b.setAttribute('aria-current',b.dataset.key===key?'true':'false')); }

function bodyHtml(b,terms){
  return b.split('\n\n').map(p=>{
    let cls=''; if(/^\([a-z]\)\s/.test(p)) cls='sub2'; else if(/^\(\d+\)\s/.test(p)) cls='sub';
    let t=esc(p); if(terms) t=hl(t,terms); return `<p class="${cls}">${t}</p>`; }).join('');
}
function hl(html,terms){ for(const t of terms){ if(t.length<2) continue; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); html=html.replace(re,'<mark>$1</mark>'); } return html; }

function secHtml(s,kind,ch,terms){
  const id=tok(kind,s.n);
  const label=kind==='const'?('Art. '+s.n.replace(' Section ',' § ')):('§ '+s.n);
  const hist=[...(s.hi||[]),...(s.src||[]),...(s.ef||[]),...(s.no||[])];
  const flag=/^\s*\(?(repealed|transferred|expired|renumbered)/i.test(s.h)||/^(Repealed|Transferred|Expired)/i.test(s.b||'')?'<span class="pill warn">Repealed / transferred</span>':'';
  return `<article class="sec" id="${esc(id)}">
    <div class="sec-head"><span class="sec-num">${esc(label)}</span><h3 class="sec-title">${esc(s.h)}</h3>${flag}</div>
    <div class="sec-body">${bodyHtml(s.b||'',terms)}</div>
    ${(hist.length||(s.an&&s.an.length))?`<div class="hist">${hist.map(x=>`<p>${esc(x)}</p>`).join('')}${(s.an&&s.an.length)?`<details><summary>${s.an.length} case annotation${s.an.length>1?'s':''}</summary>${s.an.map(x=>`<p class="ann">${esc(x)}</p>`).join('')}</details>`:''}</div>`:''}
    <div class="tools"><span class="pill">Version ${esc(s.d||'—')}</span>
      <button class="btn" data-copy="${esc(cite(kind,s.n))}">Copy citation</button>
      <button class="btn" data-copytext="${esc(id)}">Copy text</button>
      <a class="btn" href="${esc(srcUrl(kind,s.n,ch))}" target="_blank" rel="noopener">Official page ↗</a></div>
  </article>`;
}

async function openChapter(key,anchor,terms){
  const info=chapInfo(key); if(!info){view.innerHTML='<p>That chapter is not in this library.</p>';return}
  current=key; markNav(key);
  view.innerHTML=`<p class="crumb">${esc(info.g.name)}</p><h2 class="chap-h">${esc(info.c.label==='Art.'?'':'')}${esc(info.c.title)}</h2><p class="note">Loading ${esc(info.c.title)}…</p>`;
  let secs; try{secs=await getChap(key)}catch(e){view.innerHTML=`<p>Could not load this chapter (${esc(e.message)}). Check your connection and choose it again.</p>`;return}
  if(current!==key) return;
  const kind=info.c.kind;
  const versions=secs.length, uniq=new Set(secs.map(s=>s.n)).size;
  view.innerHTML=`<p class="crumb">${esc(info.g.name)}</p>
    <h2 class="chap-h">${esc(info.c.title)}</h2>
    <div class="meta-row"><span>${uniq} sections${versions>uniq?` · ${versions-uniq} additional dated versions`:''}</span><a href="${esc(kind==='const'?srcUrl('const','',key):'https://revisor.mo.gov/main/OneChapter.aspx?chapter='+key)}" target="_blank" rel="noopener">Revisor chapter page ↗</a></div>
    ${secs.length?'':'<!--'}<nav class="toc-mini" aria-label="Sections in this chapter">${secs.map(s=>`<a href="#${esc(tok(kind,s.n))}" data-jump="${esc(tok(kind,s.n))}"><b>${esc(kind==='const'?s.n.replace(/^[IVX]+ Section /,'§ '):s.n)}</b>${esc(s.h)}</a>`).join('')}</nav>${secs.length?'':'-->'}
    ${secs.length?'':'<p class="note">No sections of this chapter are currently posted on the Revisor site. The chapter has been repealed or transferred; the chapter title says where, when known.</p>'}
    ${secs.map(s=>secHtml(s,kind,key,terms)).join('')}`;
  if(anchor){ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'start'}); } }
  else read.scrollTop=0;
  try{history.replaceState(null,'','#'+(anchor||('ch'+key)))}catch(e){}
}

view.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]'); if(c){copy(c.dataset.copy);return}
  const t=e.target.closest('[data-copytext]'); if(t){const a=document.getElementById(t.dataset.copytext); if(a){const head=a.querySelector('.sec-num').textContent+' '+a.querySelector('.sec-title').textContent; copy(head+'\n\n'+[...a.querySelectorAll('.sec-body p')].map(p=>p.textContent).join('\n\n'))} return}
  const j=e.target.closest('[data-jump]'); if(j){e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({block:'start'}); try{history.replaceState(null,'','#'+j.dataset.jump)}catch(_){} return}
  const h=e.target.closest('[data-open]'); if(h){e.preventDefault(); openChapter(h.dataset.open,h.dataset.anchor,h.dataset.terms?JSON.parse(h.dataset.terms):null); return}
  const q=e.target.closest('[data-q]'); if(q){$('#q').value=q.dataset.q; $('#mode').value='auto'; runSearch(); }
});

// ---------- search ----------
function parseNumber(q){
  q=q.trim().replace(/^§+\s*/,'').replace(/,?\s*RSMo\.?$/i,'').trim();
  let m=q.match(/^(\d{1,3}[A-Z]?)\.(\d+[A-Za-z0-9\-]*)$/); if(m) return {kind:'rsmo',ch:m[1],num:m[1]+'.'+m[2]};
  m=q.match(/^(\d{1,3}[A-Z]?)$/); if(m) return {kind:'chap',ch:m[1]};
  m=q.match(/^(?:mo\.?\s*const\.?\s*)?(?:art(?:icle)?\.?\s*)?([IVX]+)[\s,]*(?:§|sec(?:tion)?\.?)?\s*(\d+)\s*(?:\(?([a-z0-9]+)\)?)?\s*(?:\(?([a-z0-9]+)\)?)?$/i);
  if(m){ const art=m[1].toUpperCase(); let n=m[2]; if(m[3]) n+='('+m[3].toLowerCase()+')'; if(m[4]) n+='('+m[4].toLowerCase()+')'; return {kind:'const',ch:art,num:art+' Section '+n}; }
  m=q.match(/^(?:art(?:icle)?\.?\s*)([IVX]+)$/i); if(m) return {kind:'chap',ch:m[1].toUpperCase()};
  return null;
}
async function runSearch(){
  const q=$('#q').value.trim(); if(!q) return;
  const mode=$('#mode').value;
  const n=parseNumber(q);
  if(n && mode!=='full'){
    if(n.kind==='chap'){ if(chapInfo(n.ch)) return openChapter(n.ch); }
    else { if(chapInfo(n.ch)) return openChapter(n.ch,tok(n.kind,n.num)); }
  }
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(mode==='full') return fullText(q,terms);
  // headings
  const hits=[];
  for(const g of TOC.groups) for(const c of g.chapters) for(const [num,h] of c.secs){
    const hay=(num+' '+h+' '+c.name).toLowerCase();
    if(terms.every(t=>hay.includes(t))) hits.push({c,num,h});
  }
  view.innerHTML=`<p class="crumb">Search</p><h2 class="chap-h">Section headings matching “${esc(q)}”</h2>
   <p class="note">${hits.length} heading match${hits.length===1?'':'es'}${hits.length>300?' (first 300 shown)':''}. Not finding it? <button class="btn" id="toFull">Search the full text instead</button></p>
   <div class="results">${hits.slice(0,300).map(x=>`<a class="hit" href="#${esc(tok(x.c.kind,x.num))}" data-open="${esc(x.c.key)}" data-anchor="${esc(tok(x.c.kind,x.num))}" data-terms='${esc(JSON.stringify(terms))}'><div class="t">${esc(x.c.kind==='const'?'Art. '+x.num.replace(' Section ',' § '):'§ '+x.num)} — ${hl(esc(x.h),terms)}</div><div class="s">${esc(x.c.title)}</div></a>`).join('')}</div>`;
  $('#toFull').addEventListener('click',()=>{$('#mode').value='full';runSearch()});
  read.scrollTop=0;
}
let ftRun=0;
async function fullText(q,terms){
  const run=++ftRun;
  const all=[]; for(const g of TOC.groups) for(const c of g.chapters) all.push(c);
  view.innerHTML=`<p class="crumb">Full-text search</p><h2 class="chap-h">“${esc(q)}” in every section</h2><div class="progress"><span id="pb"></span></div><p class="note" id="ftStatus">Reading chapters… the first full search downloads the whole library (about ${TOC.mb} MB); later searches are instant.</p><div class="results" id="ftRes"></div>`;
  read.scrollTop=0;
  const res=$('#ftRes'); let done=0, count=0; const LIMIT=500;
  const phrase=q.startsWith('"')&&q.endsWith('"')?q.slice(1,-1).toLowerCase():null;
  const tt=phrase?[phrase]:terms;
  let i=0; const workers=Array.from({length:6},async()=>{
    while(i<all.length){ const c=all[i++]; let secs; try{secs=await getChap(c.key)}catch(e){secs=[]} if(run!==ftRun) return;
      for(const s of secs){ const hay=(s.n+' '+s.h+' '+s.b).toLowerCase();
        if(tt.every(t=>hay.includes(t))){ count++; if(count<=LIMIT){
          const pos=hay.indexOf(tt[0]); const raw=(s.n+' '+s.h+' '+s.b); const st=Math.max(0,pos-90);
          const snip=(st>0?'…':'')+raw.slice(st,pos+160)+'…';
          res.insertAdjacentHTML('beforeend',`<a class="hit" href="#${esc(tok(c.kind,s.n))}" data-open="${esc(c.key)}" data-anchor="${esc(tok(c.kind,s.n))}" data-terms='${esc(JSON.stringify(tt))}'><div class="t">${esc(c.kind==='const'?'Art. '+s.n.replace(' Section ',' § '):'§ '+s.n)} — ${esc(s.h)}</div><div class="s">${hl(esc(snip),tt)}</div></a>`);
        }}}
      done++; const pb=$('#pb'); if(pb) pb.style.width=(100*done/all.length)+'%';
      const st=$('#ftStatus'); if(st) st.textContent=`Searched ${done} of ${all.length} chapters · ${count} matching section${count===1?'':'s'}${count>LIMIT?' (first '+LIMIT+' shown)':''}`;
    }});
  await Promise.all(workers);
  if(run===ftRun){ const st=$('#ftStatus'); if(st) st.textContent=`Done · ${count} matching section${count===1?'':'s'} in ${all.length} chapters${count>LIMIT?' (first '+LIMIT+' shown — add a word to narrow it)':''}. Tip: put a phrase in quotes for an exact match.`; }
}
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch()});
$('#menuBtn').addEventListener('click',()=>{const o=nav.classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',String(o))});

function home(){
  current=null; markNav('');
  view.innerHTML=`<p class="crumb">Revised Statutes of Missouri &amp; Missouri Constitution</p>
  <h2 class="chap-h">The whole of Missouri's written law, in one place</h2>
  <p class="note">Text captured ${esc(TOC.captured)} from the Revisor of Statutes. The Revisor's site states its posted text is uncertified and unofficial; cite the printed RSMo or confirm on the official page before filing.</p>
  <div class="home-grid">
    <div class="stat"><b>${TOC.counts.const.toLocaleString()}</b><span>Constitution sections · 14 articles</span></div>
    <div class="stat"><b>${TOC.counts.rsmo.toLocaleString()}</b><span>RSMo sections · ${TOC.counts.chapters} chapters</span></div>
    <div class="stat"><b>${TOC.counts.versions.toLocaleString()}</b><span>Extra dated versions kept (future or contingent text)</span></div>
  </div>
  <p class="crumb">Jump to sections from your cases</p>
  <div class="quick">${['575.150','565.054','565.056','455.085','455.010','491.074','562.011','563.031','544.170','610.021','516.120','I 18(a)','I 15','I 19','V 18'].map(x=>`<button data-q="${esc(x)}">${esc(/^[IVX]/.test(x)?'Art. '+x:'§ '+x)}</button>`).join('')}</div>
  <p class="note">Search by number (<code>575.150</code>, <code>I 18(a)</code>, <code>Article V</code>), by words in section headings, or switch the scope to <b>Full text</b> to search every word of every section.</p>`;
}
function route(){
  const h=decodeURIComponent((location.hash||'').slice(1));
  let m;
  if((m=h.match(/^s(\d{1,3}[A-Z]?)\.(.+)$/))) return openChapter(m[1],h);
  if((m=h.match(/^c([IVX]+)-/))) return openChapter(m[1],h);
  if((m=h.match(/^ch(.+)$/))) return openChapter(m[1]);
  home();
}
fetch('data/toc.json').then(r=>{if(!r.ok) throw new Error('HTTP '+r.status);return r.json()}).then(t=>{TOC=t; $('#asof').textContent=`Constitution & RSMo · captured ${t.captured} from revisor.mo.gov`; buildNav(); route();})
 .catch(e=>{view.innerHTML=`<p>The table of contents did not load (${esc(e.message)}). Reload the page to try again.</p>`});
})();
</script>
