<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missouri Law Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane statute reader. Left rail = Titles → Chapters / Constitution articles; right = the law, set like a printed code. */
:root{
  --paper:#f4f6f8; --sheet:#ffffff; --ink:#15233b; --muted:#5b6678; --rule:#d9dee6;
  --accent:#1f6f62; --accent-soft:#e3f0ec; --flag:#9a5b00; --flag-soft:#fbf0dc; --hit:#fff1a8;
  --f-law:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-cite:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1520; --sheet:#151d2b; --ink:#e3e8f0; --muted:#98a3b6; --rule:#2a3446;
  --accent:#62c2ad; --accent-soft:#17312d; --flag:#f0b45a; --flag-soft:#3a2c14; --hit:#5a4c00; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1520; --sheet:#151d2b; --ink:#e3e8f0; --muted:#98a3b6; --rule:#2a3446;
  --accent:#62c2ad; --accent-soft:#17312d; --flag:#f0b45a; --flag-soft:#3a2c14; --hit:#5a4c00; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-law);font-size:1.25rem;letter-spacing:.01em}
.brand span{font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.search{display:flex;gap:6px;flex:1 1 380px;max-width:640px;min-width:0}
.search input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.rail{overflow:auto;border-right:1px solid var(--rule);background:var(--sheet);padding:8px 0 40px}
.rail details{border-bottom:1px solid var(--rule)}
.rail summary{cursor:pointer;padding:7px 14px;display:grid;grid-template-columns:3.2em 1fr;gap:6px;font-size:.86rem;font-weight:600;letter-spacing:.02em}
.rail summary .rn{font-family:var(--f-cite);font-weight:500;color:var(--accent)}
.rail .ch{display:grid;grid-template-columns:4.4em 1fr;gap:6px;padding:4px 14px 4px 24px;font-size:.86rem;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.rail .ch:hover,.rail .ch.on{background:var(--accent-soft)}
.rail .ch .n{font-family:var(--f-cite);color:var(--muted)}
main{overflow:auto;padding-block:20px 80px;padding-inline:clamp(16px,4vw,48px)}
.page{max-width:72ch;margin:0 auto}
.crumb{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-law);font-weight:700;font-size:1.65rem;line-height:1.2;margin:.2em 0 .6em;text-wrap:balance}
h2{font-family:var(--f-law);font-size:1.1rem;margin:0}
.toc{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{display:grid;grid-template-columns:6.4em 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 2px;cursor:pointer}
.toc button:hover{background:var(--accent-soft)}
.cite{font-family:var(--f-cite);font-size:.88rem;color:var(--accent);font-variant-numeric:tabular-nums}
.eff{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin:0 0 18px}
.sec header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:10px}
.sec .law{font-family:var(--f-law);font-size:1.02rem;line-height:1.7}
.law p{margin:0 0 .7em}
.law p.sub{padding-left:1.6em}
.law p.sub2{padding-left:3.2em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);font-size:.82rem;color:var(--muted)}
.hist{font-family:var(--f-law);font-style:italic;white-space:pre-line}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;letter-spacing:.03em}
.pill.future{background:var(--flag-soft);color:var(--flag)}
.pill.book{background:var(--accent-soft);color:var(--accent)}
.pill.old{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
a{color:var(--accent)}
.notes summary{cursor:pointer;color:var(--accent);font-size:.85rem;margin-top:10px}
.notes p{font-family:var(--f-law);font-size:.9rem;margin:.5em 0}
mark{background:var(--hit);color:inherit;padding:0 1px}
.results .r{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.results .r:hover{border-color:var(--accent)}
.results .snip{font-family:var(--f-law);font-size:.9rem;color:var(--muted);margin-top:4px}
.status{font-size:.85rem;color:var(--muted);margin:6px 0 14px}
.bar{height:4px;background:var(--rule);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.intro{font-family:var(--f-law);font-size:1rem}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:16px 0 22px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-law);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.menu-btn{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  nav.rail{position:fixed;inset:auto 0 0 0;top:0;z-index:5;transform:translateX(-100%);transition:transform .2s;width:min(88vw,340px);padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
  nav.rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <button class="btn menu-btn" id="menuBtn" aria-label="Browse chapters">☰ Browse</button>
    <div class="brand"><b>Missouri Law Library</b><span id="asof">RSMo &amp; Missouri Constitution</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabR" role="tab" aria-selected="true">RSMo</button>
      <button class="tab" id="tabC" role="tab" aria-selected="false">Constitution</button>
    </div>
    <form class="search" id="sform" role="search">
      <input id="q" type="search" placeholder="Section number (455.085, art I 18a) or words (order of protection)" aria-label="Search">
      <button class="btn primary" type="submit">Search</button>
      <button class="btn" type="button" id="fullBtn" title="Search the full text of every section">Full text</button>
    </form>
  </header>
  <nav class="rail" id="rail" aria-label="Titles and chapters"></nav>
  <main id="main"><div class="page" id="page"><p class="status">Loading the index…</p></div></main>
</div>

<script>
const BOOK_URL="https://claude.ai/artifact/WTDztHyYz9nnPM73GDNutW";
let IDX=null, CONST=null, TITLES={}, mode='rsmo';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=new Date();
function parseEff(e){ if(!e) return null; let m=e.match(/^(\d+)\/(\d+)\/(\d{4})$/); if(m) return new Date(+m[3],m[1]-1,+m[2]); const d=new Date(e); return isNaN(d)?null:d; }
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}

async function getJSON(p){const r=await fetch(p); if(!r.ok) throw new Error(p+' '+r.status); return r.json();}
async function titleData(file){ if(!TITLES[file]) TITLES[file]=getJSON('data/t/'+file+'.json'); return TITLES[file]; }
function chapInfo(c){ for(const t of IDX.titles) for(const ch of t.chs) if(ch.c===c) return {t,ch}; return null; }

function lawHTML(text, hl){
  return text.split('\n').map(p=>{
    let cls=''; if(/^\(\d+\)|^\([a-z]\)/.test(p)) cls=' class="sub"'; if(/^\([a-z]\)/.test(p)) cls=' class="sub2"';
    let h=esc(p); if(hl) h=highlight(h,hl); return `<p${cls}>${h}</p>`;}).join('');
}
function highlight(h,terms){ for(const t of terms){ if(t.length<3) continue; h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); } return h; }
function versionPill(v,all){
  const d=parseEff(v.eff); if(!d) return '';
  if(d>today) return `<span class="pill future">Takes effect ${esc(v.eff)}</span>`;
  if(all.length>1){ const cur=all.filter(x=>{const e=parseEff(x.eff);return e&&e<=today}).sort((a,b)=>parseEff(b.eff)-parseEff(a.eff))[0]; if(cur&&cur!==v) return `<span class="pill old">Earlier version</span>`; }
  return '';
}
function secCard(v,all,hl){
  const inBook=IDX.book.includes(v.sec);
  const url='https://revisor.mo.gov/main/OneSection.aspx?section='+encodeURIComponent(v.sec);
  return `<article class="sec" id="s${esc(v.sec)}">
    <header><span class="cite">§ ${esc(v.sec)}</span><h2>${esc(v.title)}</h2>${versionPill(v,all)}${inBook?`<a class="pill book" href="${BOOK_URL}" target="_blank" rel="noopener">Annotated in your Statute Book</a>`:''}</header>
    <div class="law">${lawHTML(v.text||'(No text — see the revisor page.)',hl)}</div>
    <div class="meta">${v.eff?`<span class="eff">Effective ${esc(v.eff)}</span>`:''}${v.hist?`<span class="hist">${esc(v.hist)}</span>`:''}
      <a href="${url}" target="_blank" rel="noopener">revisor.mo.gov</a>
      <button class="btn" data-copy="§ ${esc(v.sec)}, RSMo">Copy cite</button></div>
    ${v.notes&&v.notes.length?`<details class="notes"><summary>Revisor's case notes (${v.notes.length})</summary>${v.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}</article>`;
}

function renderRail(){
  const r=$('#rail');
  if(mode==='rsmo'){
    r.innerHTML=IDX.titles.map(t=>`<details><summary><span class="rn">${esc(t.r)}</span><span>${esc(t.n)}</span></summary>${t.chs.map(c=>`<button class="ch" data-ch="${esc(c.c)}"><span class="n">Ch. ${esc(c.c)}</span><span>${esc(c.n)}</span></button>`).join('')}</details>`).join('');
  } else {
    r.innerHTML=CONST.arts.map(a=>`<button class="ch" data-art="${esc(a.a)}"><span class="n">Art. ${esc(a.a)}</span><span>${esc(a.n)}</span></button>`).join('');
  }
}

async function showChapter(c, focus){
  const info=chapInfo(c); if(!info){ renderHome(`Chapter ${esc(c)} has no current sections on the revisor's site.`); return; }
  const P=$('#page'); P.innerHTML=`<p class="status">Loading chapter ${esc(c)}…</p>`;
  const data=await titleData(info.t.f); const secs=data[c]||[];
  const groups={}; secs.forEach(s=>(groups[s.sec]=groups[s.sec]||[]).push(s));
  P.innerHTML=`<div class="crumb">Title ${esc(info.t.r)} · ${esc(info.t.n)}</div><h1>Chapter ${esc(c)}: ${esc(info.ch.n)}</h1>
   <ul class="toc">${Object.keys(groups).map(k=>`<li><button data-jump="${esc(k)}"><span class="cite">§ ${esc(k)}</span><span>${esc(groups[k][0].title)}</span><span class="eff">${esc(groups[k].map(v=>v.eff).filter(Boolean).join(' · '))}</span></button></li>`).join('')}</ul>
   <div style="height:20px"></div>${Object.values(groups).map(g=>g.map(v=>secCard(v,g)).join('')).join('')}`;
  document.querySelectorAll('.rail .ch').forEach(b=>b.classList.toggle('on',b.dataset.ch===c));
  store('mll-last','c'+c);
  if(focus){ const el=document.getElementById('s'+focus); if(el){ el.scrollIntoView({block:'start'}); } } else $('#main').scrollTop=0;
}
async function showSection(sec){
  const c=sec.split('.')[0]; await showChapter(c, sec); history.replaceState(null,'','#s'+sec);
}
function showArticle(a, focus){
  const art=CONST.arts.find(x=>x.a===a); if(!art) return;
  $('#page').innerHTML=`<div class="crumb">Constitution of Missouri (1945, as amended)</div><h1>Article ${esc(a)}: ${esc(art.n)}</h1>
  <ul class="toc">${art.s.map(s=>`<li><button data-cjump="${esc(a)}-${esc(s.sec)}"><span class="cite">§ ${esc(s.sec)}</span><span>${esc(s.title)}</span><span class="eff">${esc(s.eff||'')}</span></button></li>`).join('')}</ul><div style="height:20px"></div>
  ${art.s.map(s=>constCard(a,s)).join('')}`;
  document.querySelectorAll('.rail .ch').forEach(b=>b.classList.toggle('on',b.dataset.art===a));
  store('mll-last','a'+a);
  if(focus){const el=document.getElementById('c'+a+'-'+focus.replace(/[()]/g,'')); el&&el.scrollIntoView({block:'start'});} else $('#main').scrollTop=0;
}
function constCard(a,s,hl){
  const id='c'+a+'-'+s.sec.replace(/[()]/g,'');
  return `<article class="sec" id="${esc(id)}"><header><span class="cite">Art. ${esc(a)}, § ${esc(s.sec)}</span><h2>${esc(s.title)}</h2>${IDX.book.includes('const-'+a+'-'+s.sec)?`<a class="pill book" href="${BOOK_URL}" target="_blank" rel="noopener">Annotated in your Statute Book</a>`:''}</header>
  <div class="law">${lawHTML(s.text,hl)}</div>
  <div class="meta">${s.eff?`<span class="eff">Effective ${esc(s.eff)}</span>`:''}${s.hist?`<span class="hist">${esc(s.hist)}</span>`:''}
   <a href="https://revisor.mo.gov/main/OneSection.aspx?section=${encodeURIComponent(a+'    '+s.sec)}&constit=y" target="_blank" rel="noopener">revisor.mo.gov</a>
   <button class="btn" data-copy="Mo. Const. art. ${esc(a)}, § ${esc(s.sec)}">Copy cite</button></div>
  ${s.notes&&s.notes.length?`<details class="notes"><summary>Revisor's case notes (${s.notes.length})</summary>${s.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}</article>`;
}

function renderHome(msg){
  const st=IDX.stats;
  $('#page').innerHTML=`<div class="crumb">Official text from the Missouri Revisor of Statutes</div><h1>Revised Statutes of Missouri and the Missouri Constitution</h1>
  ${msg?`<p class="status">${msg}</p>`:''}
  <p class="intro">Every section of the RSMo and every section of the Constitution, captured from revisor.mo.gov on ${esc(IDX.built)}. Pick a chapter on the left, type a section number, or search the words of the law.</p>
  <div class="stats"><div><b>${st.titles}</b><span>Titles</span></div><div><b>${st.chapters}</b><span>Chapters</span></div><div><b>${st.sections.toLocaleString()}</b><span>RSMo sections</span></div><div><b>${st.const}</b><span>Constitution sections</span></div></div>
  <h2 style="margin-bottom:8px">Sections in your cases</h2>
  <div class="quick">${IDX.quick.map(q=>`<button class="btn" data-go="${esc(q[0])}">${esc(q[1])}</button>`).join('')}</div>
  <p class="status" style="margin-top:22px">The revisor marks this online text as unofficial and uncertified. Check the certified RSMo or the revisor's page before quoting in a filing. Sections marked “Takes effect” are not yet in force.</p>`;
}

function parseCite(q){
  q=q.trim().replace(/^§+\s*/,'').replace(/,?\s*RSMo$/i,'');
  let m=q.match(/^(?:rsmo\s*)?(\d+[A-Z]?\.\d+[A-Z]?)$/i); if(m) return {sec:m[1].toUpperCase()};
  m=q.match(/^(?:mo\.?\s*)?(?:const\.?|constitution)?\s*art(?:icle)?\.?\s*([IVX]+)\s*,?\s*(?:§|sec(?:tion)?\.?)?\s*(\d+)\s*\(?([a-z])?\)?$/i);
  if(m) return {art:m[1].toUpperCase(),sec:m[2]+(m[3]?'('+m[3].toLowerCase()+')':'')};
  m=q.match(/^(?:ch(?:apter)?\.?\s*)(\d+[A-Z]?)$/i); if(m) return {ch:m[1].toUpperCase()};
  return null;
}
function titleSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean); const out=[];
  for(const t of IDX.titles) for(const c of t.chs) for(const s of c.s){ const hay=(s[1]+' '+c.n).toLowerCase(); if(terms.every(w=>hay.includes(w))) out.push({sec:s[0],title:s[1],eff:s[2],ch:c}); }
  const cout=[]; for(const a of CONST.arts) for(const s of a.s){ const hay=(s.title+' '+s.text).toLowerCase(); if(terms.every(w=>hay.includes(w))) cout.push({a:a.a,s}); }
  return {out,cout,terms};
}
function renderResults(q,res,full){
  const {out,cout,terms}=res;
  $('#page').innerHTML=`<div class="crumb">${full?'Full-text':'Section-title'} search</div><h1>“${esc(q)}”</h1>
  <p class="status">${out.length.toLocaleString()} RSMo section${out.length===1?'':'s'} · ${cout.length} Constitution section${cout.length===1?'':'s'}${full?'':' · Titles only. Use <b>Full text</b> to search the words of every section.'}</p>
  <div class="results">${cout.slice(0,40).map(r=>`<button class="r" data-cgo="${esc(r.a)}|${esc(r.s.sec)}"><span class="cite">Art. ${esc(r.a)}, § ${esc(r.s.sec)}</span> ${esc(r.s.title)}<div class="snip">${snippet(r.s.text,terms)}</div></button>`).join('')}
  ${out.slice(0,400).map(r=>`<button class="r" data-go="${esc(r.sec)}"><span class="cite">§ ${esc(r.sec)}</span> ${esc(r.title)} <span class="eff">· Ch. ${esc(r.ch.c)} ${esc(r.ch.n)}</span>${r.snip?`<div class="snip">${r.snip}</div>`:''}</button>`).join('')}</div>
  ${out.length>400?'<p class="status">Showing the first 400. Add words to narrow the search.</p>':''}`;
  $('#main').scrollTop=0;
}
function snippet(text,terms){ const low=text.toLowerCase(); const ph=terms.join(' '); let i=low.indexOf(ph); if(i>=0) terms=[ph,...terms]; for(const t of terms){ if(i>=0) break; i=low.indexOf(t); if(i>=0) break; } if(i<0) return esc(text.slice(0,160))+'…'; const s=Math.max(0,i-80); return (s?'…':'')+highlight(esc(text.slice(s,s+240)),terms)+'…'; }

async function fullSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(w=>w.length>1); if(!terms.length) return;
  const P=$('#page'); P.innerHTML=`<div class="crumb">Full-text search</div><h1>“${esc(q)}”</h1><div class="bar"><i id="prog"></i></div><p class="status" id="pst">Reading 0 of ${IDX.titles.length} titles…</p>`;
  const out=[]; let n=0;
  for(const t of IDX.titles){
    const data=await titleData(t.f); n++;
    for(const c of t.chs) for(const s of (data[c.c]||[])){ const hay=(s.title+' '+s.text).toLowerCase(); if(terms.every(w=>hay.includes(w))) out.push({sec:s.sec,title:s.title,ch:c,snip:snippet(s.text,terms)}); }
    const p=document.getElementById('prog'); if(p){p.style.width=(100*n/IDX.titles.length)+'%'; document.getElementById('pst').textContent=`Reading ${n} of ${IDX.titles.length} titles… ${out.length} matches so far`;}
  }
  const cout=[]; for(const a of CONST.arts) for(const s of a.s){ const hay=(s.title+' '+s.text).toLowerCase(); if(terms.every(w=>hay.includes(w))) cout.push({a:a.a,s}); }
  renderResults(q,{out,cout,terms},true);
}

function go(q){
  const c=parseCite(q);
  if(c&&c.sec&&!c.art){ setMode('rsmo'); return showSection(c.sec); }
  if(c&&c.art){ setMode('const'); return showArticle(c.art,c.sec); }
  if(c&&c.ch){ setMode('rsmo'); return showChapter(c.ch); }
  renderResults(q,titleSearch(q),false);
}
function setMode(m){ mode=m; $('#tabR').setAttribute('aria-selected',m==='rsmo'); $('#tabC').setAttribute('aria-selected',m==='const'); renderRail(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ch){ showChapter(b.dataset.ch); $('#rail').classList.remove('open'); }
  else if(b.dataset.art){ showArticle(b.dataset.art); $('#rail').classList.remove('open'); }
  else if(b.dataset.jump){ document.getElementById('s'+b.dataset.jump)?.scrollIntoView({block:'start'}); }
  else if(b.dataset.cjump){ document.getElementById('c'+b.dataset.cjump.replace(/[()]/g,''))?.scrollIntoView({block:'start'}); }
  else if(b.dataset.go){ go(b.dataset.go); }
  else if(b.dataset.cgo){ const [a,s]=b.dataset.cgo.split('|'); setMode('const'); showArticle(a,s); }
  else if(b.dataset.copy){ const t=b.dataset.copy; const done=()=>{b.textContent='Copied'; setTimeout(()=>b.textContent='Copy cite',1400)}; navigator.clipboard?.writeText(t).then(done,()=>{b.textContent=t}); }
});
$('#tabR').onclick=()=>{setMode('rsmo'); renderHome();};
$('#tabC').onclick=()=>{setMode('const'); showArticle('I');};
$('#menuBtn').onclick=()=>$('#rail').classList.toggle('open');
$('#sform').onsubmit=e=>{e.preventDefault(); const q=$('#q').value.trim(); if(q) go(q);};
$('#fullBtn').onclick=()=>{const q=$('#q').value.trim(); if(q) fullSearch(q); else $('#q').focus();};

(async()=>{
  try{
    [IDX,CONST]=await Promise.all([getJSON('data/index.json'),getJSON('data/constitution.json')]);
  }catch(err){ $('#page').innerHTML='<p class="status">The statute index did not load. Reload the page to try again.</p>'; return; }
  $('#asof').textContent='RSMo & Constitution · captured '+IDX.built;
  setMode('rsmo');
  const h=location.hash.slice(1);
  if(/^s\d/.test(h)) return showSection(h.slice(1));
  if(/^c[IVX]+/.test(h)){ setMode('const'); const m=h.match(/^c([IVX]+)-?(.*)$/); return showArticle(m[1],m[2]||null); }
  renderHome();
})();
</script>

</body></html>
